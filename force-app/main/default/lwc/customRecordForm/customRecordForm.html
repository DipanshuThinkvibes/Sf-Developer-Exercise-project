<template>
    <lightning-card title={formTitle} icon-name="standard:record">
        <div class="slds-p-around_medium">

            <lightning-record-edit-form
                object-api-name={resolvedObjectApiName}
                record-id={recordId}
                onsubmit={handleSubmit}
                onsuccess={handleSuccess}
                onerror={handleError}>

                <lightning-messages></lightning-messages>

                <template for:each={fields} for:item="field">
                    <lightning-input-field
                        key={field}
                        field-name={field}>
                    </lightning-input-field>
                </template>

                <div class="slds-m-top_medium">
                    <lightning-button
                        type="submit"
                        label="Save"
                        variant="brand">
                    </lightning-button>
                </div>

            </lightning-record-edit-form>

        </div>
    </lightning-card>
</template>
